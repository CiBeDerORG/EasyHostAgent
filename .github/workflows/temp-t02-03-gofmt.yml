name: Temporary T02-03 Go formatting
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-t02-03-gofmt.yml
permissions:
  contents: write
jobs:
  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format modified Go packages
        run: |
          gofmt -w internal/dockerengine internal/httpapi internal/app
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/dockerengine internal/httpapi internal/app
            git commit -m "style(T02-03): format Docker actions, logs and secured routes"
            git push
          fi
