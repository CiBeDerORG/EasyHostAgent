name: EasyHostAgent 开发版二进制发布

on:
  push:
    branches:
      - feat/docker-app-store
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/development-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: easyhostagent-development-release
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: 验证 Go 代码
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
      - name: 构建并校验双架构二进制
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/CiBeDerORG/EasyHostAgent/internal/buildinfo.Commit=${GITHUB_SHA}" \
              -o "dist/easyhostagent-linux-$arch" ./cmd/easyhostagent
            (
              cd dist
              sha256sum "easyhostagent-linux-$arch" > "easyhostagent-linux-$arch.sha256"
            )
          done
      - name: 发布可滚动更新的开发版 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.1.0-appstore.dev"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "EasyHostAgent 应用商店开发版（滚动）" \
              --notes "仅用于 feat/docker-app-store 分支联调。Release 资产会更新，请勿将此可变标签作为生产环境版本锁定依据。" \
              --prerelease
          fi
          gh release upload "$tag" dist/easyhostagent-linux-amd64 dist/easyhostagent-linux-amd64.sha256 \
            dist/easyhostagent-linux-arm64 dist/easyhostagent-linux-arm64.sha256 --clobber
          echo "开发版已发布：$tag / $GITHUB_SHA"
