name: Temporary T02-01 Go formatting
on:
  push:
    branches: [main]
    paths:
      - internal/dockerengine/**
      - .github/workflows/temp-t02-01-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt and commit
        run: |
          gofmt -w internal/dockerengine
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/dockerengine
            git commit -m "style(T02-01): format Docker Engine adapter"
            git push
          fi
