name: Temporary T02-02 gofmt
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-t02-02-gofmt.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Apply gofmt for Compose aggregation
        run: |
          gofmt -w internal/dockerengine/group.go internal/dockerengine/group_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/dockerengine/group.go internal/dockerengine/group_test.go
            git commit -m "style(T02-02): format Compose grouping and tests"
            git push
          fi
