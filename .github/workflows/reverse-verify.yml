name: Reverse feature formatting and verification
on:
  push:
    branches: ['feat/reverse-temporary-host-20261113']
    paths: ['.github/workflows/reverse-verify.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format and commit feature branch only
        run: |
          gofmt -w internal/app/app.go internal/reverse/client.go internal/reverse/client_test.go
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add internal/app/app.go internal/reverse/client.go internal/reverse/client_test.go
            git commit -m "style: 规范化反向接入 Go 代码"
            git push origin HEAD:feat/reverse-temporary-host-20261113
          fi
      - name: Compile and test
        run: |
          go vet ./... && go test ./...
