name: EasyHostAgent macOS Docker 第二阶段验证

on:
  push:
    branches:
      - feat/macos-docker-phase2-20261106
  pull_request:
    paths:
      - "internal/**"
      - "cmd/**"
      - ".github/workflows/macos-docker-phase2.yml"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    name: macOS 原生 Docker Socket 和回归测试
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: macOS 原生测试及静态检查
        run: |
          export TMPDIR="$HOME/t"
          mkdir -p "$TMPDIR"
          chmod 0700 "$TMPDIR"
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
      - name: 构建 macOS ARM64
        run: |
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/easyhostagent-macos-phase2 ./cmd/easyhostagent
          file /tmp/easyhostagent-macos-phase2
  linux-regression:
    name: Linux 原有接口回归
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: |
          test -z "$(gofmt -l cmd internal)"
          go test ./...
