name: EasyHostAgent Contract Tests

on:
  push:
    paths:
      - "tests/contracts/**"
      - "docs/api/**"
      - "docs/schema/**"
      - ".github/workflows/contract-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install offline test dependencies
        run: python -m pip install "jsonschema>=4.20,<5"
      - name: Validate API examples, Docker fixtures and SQLite constraints
        run: python -m unittest discover -s tests/contracts -p "test_*.py" -v
