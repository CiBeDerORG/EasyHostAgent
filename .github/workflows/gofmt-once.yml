name: T01-03 One-Time Go Formatting
on:
  push:
    paths:
      - ".github/workflows/gofmt-once.yml"
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Format new Go source and commit result
        run: |
          gofmt -w cmd internal
          if ! git diff --quiet -- cmd internal; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cmd internal
            git commit -m "style(T01-03): gofmt HTTPS identity and HTTP API code"
            git push origin HEAD:main
          fi
