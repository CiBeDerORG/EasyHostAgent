name: EasyHostAgent 多架构容器镜像

on:
  push:
    branches:
      - feat/deploy-manifest-lifecycle
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - ".github/workflows/container-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: easyhostagent-container-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: 检查 Go 格式、静态问题和单元测试
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 构建并推送 AMD64 与 ARM64 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
          tags: |
            ghcr.io/cibederorg/easyhostagent:feat-deploy-manifest-lifecycle
            ghcr.io/cibederorg/easyhostagent:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/CiBeDerORG/EasyHostAgent
            org.opencontainers.image.revision=${{ github.sha }}
