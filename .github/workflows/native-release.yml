name: EasyHostAgent 原生程序发布

on:
  push:
    branches:
      - main
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/native-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: easyhostagent-native-deploy-manifest-release
  cancel-in-progress: true

jobs:
  release:
    name: 发布 Linux AMD64/ARM64 与 macOS ARM64 二进制
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: 检查格式与单元测试
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(gofmt -l cmd internal)"
          go vet ./...
          go test ./...
      - name: 构建 Linux AMD64/ARM64 与 macOS ARM64 安装文件和 SHA-256
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/CiBeDerORG/EasyHostAgent/internal/buildinfo.Version=0.1.0-dev -X github.com/CiBeDerORG/EasyHostAgent/internal/buildinfo.Commit=$GITHUB_SHA" \
              -o "dist/easyhostagent-linux-$arch" ./cmd/easyhostagent
            (
              cd dist
              sha256sum "easyhostagent-linux-$arch" > "easyhostagent-linux-$arch.sha256"
            )
          done
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath \
            -ldflags "-s -w -X github.com/CiBeDerORG/EasyHostAgent/internal/buildinfo.Version=0.1.0-dev -X github.com/CiBeDerORG/EasyHostAgent/internal/buildinfo.Commit=$GITHUB_SHA" \
            -o dist/easyhostagent-darwin-arm64 ./cmd/easyhostagent
          (
            cd dist
            sha256sum easyhostagent-darwin-arm64 > easyhostagent-darwin-arm64.sha256
          )
          file dist/easyhostagent-darwin-arm64
      - name: 更新原生开发版 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="v0.1.0-deploy-manifest-lifecycle.dev"
          # 这是可滚动更新的开发标签；每次发布均让 Git Tag 指向本次构建源码。
          git tag -f "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "EasyHostAgent 生命周期开发版" \
              --notes "Linux AMD64/ARM64 原生 systemd 安装包，附 SHA-256 校验文件；此开发版标签及资产可更新。" \
              --prerelease
          fi
          gh release edit "$tag" --notes "统一原生开发版：Linux AMD64/ARM64 与 macOS Apple Silicon ARM64，所有平台共用同一 Release 标签；每个二进制附 SHA-256 校验文件。此开发版标签及资产可更新。"
          gh release upload "$tag" \
            dist/easyhostagent-linux-amd64 dist/easyhostagent-linux-amd64.sha256 \
            dist/easyhostagent-linux-arm64 dist/easyhostagent-linux-arm64.sha256 \
            dist/easyhostagent-darwin-arm64 dist/easyhostagent-darwin-arm64.sha256 --clobber
